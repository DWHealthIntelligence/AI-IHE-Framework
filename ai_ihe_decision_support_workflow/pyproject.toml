[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ihe-decision-support-workflow"
version = "0.1.1"
authors = [
  { name="Dan Wu", email="wudan_zjubme@zju.edu.cn" },
  { name="Yaoqian Sun", email="sunyaoqian@zju.edu.cn" },
  { name="Ruixin Dai", email="agreewithu@zju.edu.cn" },
  { name="Ning Deng", email="zju.dengning@gmail.com" },
]
description = "AI-Assisted Decision Support Framework for Individualized Health Examination"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "torch",
    "pyts",
    "neo4j",
    "scipy",
    "matplotlib",
    "openpyxl"
]

[project.urls]
"Homepage" = "https://github.com/DWHealthIntelligence//ai-ihe-decision-support-workflow"